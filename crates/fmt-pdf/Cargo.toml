[package]
name = "viewit-fmt-pdf"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt PDF rendering path — Phase 2.2 (per ADR 0002: bundled pdfium arm64)"

[dependencies]
viewit-core-types = { path = "../core-types" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
# pdfium-render: dynamic linking at runtime (per ADR 0002).
# The libpdfium.so is bundled alongside the binary.
pdfium-render = { version = "=0.9.2", default-features = false, features = ["image_latest", "thread_safe", "pdfium_latest"] }
image = { version = "0.25", default-features = false }
base64 = "0.22"
