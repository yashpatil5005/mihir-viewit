[package]
name = "viewit-fmt-office-universal"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt unified Office parser — OOXML + Legacy Binary + OpenDocument (docx/xlsx/pptx + doc/ppt + odt/ods/odp + templates)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
viewit-core-types = { path = "../core-types" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true

# XLSX + ODS via calamine (disable zstd for WASM)
calamine = { version = "=0.36.0", default-features = false }
# DOCX via docx-rust
docx-rust = "=0.1.11"
# PPTX / ODT / ODP zip+XML parsing
zip = { version = "=8.6.0", default-features = false }
quick-xml = "0.36"
# Legacy binary (.doc/.ppt) via CFB
cfb = "=0.7.3"
# Encrypted Office (optional)
office-crypto = { version = "=0.2.0", optional = true }

[features]
default = []
# Encrypted Office files (.docx/.xlsx/.pptx with password)
support-encrypted = ["dep:office-crypto"]
# WASM build target
wasm = ["viewit-core-types/wasm"]
# Optional logging in WASM
log = ["dep:console_log"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# wasm-bindgen for WASM exports
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
# console_error_panic_hook for better panic messages in browser
console_error_panic_hook = "0.1.7"
# Optional console logging
console_log = { version = "0.2", optional = true }

[package.metadata.wasm-pack]
[package.metadata.wasm-pack.profile.release]
wasm-opt = false