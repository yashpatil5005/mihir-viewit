[package]
name = "viewit-plugin-office-universal"
version = "0.1.3"
edition = "2021"
description = "ViewIt Android native plugin for unified Office formats"
license = "MIT OR Apache-2.0"

[lib]
name = "viewit_plugin_office_universal"
path = "src/main/rust/lib.rs"
crate-type = ["cdylib", "staticlib"]

[dependencies]
viewit-fmt-office = { path = "../../../../crates/fmt-office", features = ["support-encrypted"] }
jni = "0.21"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"

[workspace]