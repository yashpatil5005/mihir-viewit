[package]
name="viewit-plugin-iwork-universal"
version="0.1.0"
edition="2021"
license="MIT OR Apache-2.0"
[lib]
name="viewit_plugin_iwork_universal"
path="src/main/rust/lib.rs"
crate-type=["cdylib","staticlib"]
[dependencies]
viewit-fmt-iwork={path="../../../../crates/fmt-iwork"}
viewit-core-types={path="../../../../crates/core-types"}
jni="0.21"
serde_json="1"
[profile.release]
opt-level="z"
lto=true
codegen-units=1
panic="abort"
strip=true
[target.aarch64-linux-android]
linker="aarch64-linux-android21-clang"
[target.x86_64-linux-android]
linker="x86_64-linux-android21-clang"
[workspace]
