[package]
name = "viewit-mobile"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt mobile (Android — arm64-v8a only Phase 1)"

[lib]
name = "viewit_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# On Android this binary is not invoked directly; the mobile_entry_point kicks in
# via the lib. Keeping the bin target only because Tauri's setup expects it.
name = "viewit-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
viewit-core = { path = "../../../crates/core", features = ["fmt-text"] }
viewit-core-types = { path = "../../../crates/core-types" }
# custom-protocol: release webview serves embedded frontend, not devUrl (CLI sets this too).
tauri = { workspace = true, features = ["custom-protocol"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-fs.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-notification.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
base64.workspace = true
http = "1"
mime_guess = "2"
url = "2"
tiny_http = "0.12"
viewit-fmt-pdf = { path = "../../../crates/fmt-pdf", optional = true }
viewit-fmt-image = { path = "../../../crates/fmt-image" }
# HEIC/HEIF decode — pure-Rust `hpvcd` (BSD-3-Clause OR Apache-2.0, no copyleft;
# replaces the former AGPL `heic` crate). neon = arm64 SIMD.
hpvcd = { version = "0.3", features = ["neon"] }
image = { workspace = true, default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log.workspace = true

[features]
default = ["fmt-text-only"]
fmt-text-only = ["viewit-core/fmt-text"]
# Minimal native build — only essential formats built-in.
# Office, Archive, iWork, Font are delivered via WASM plugins (smaller APK).
# Ebook (epub/mobi) is included natively for better UX.
fmt-mobile = [
  "fmt-text-only",
  "fmt-image",
  "fmt-ebook",
]
# Full feature set (for desktop/comparison) - not used on mobile
fmt-everything-lite = [
  "fmt-mobile",
  "fmt-office",
  "fmt-archive",
  "fmt-ebook",
  "fmt-iwork",
  "fmt-font",
]
fmt-everything = [
  "fmt-everything-lite",
  "fmt-pdf",
  "viewit-core/archive-7z",
  "viewit-core/office-encrypted",
]
fmt-office = ["viewit-core/fmt-office"]
fmt-pdf = ["viewit-core/fmt-pdf", "viewit-fmt-pdf"]
fmt-archive = ["viewit-core/fmt-archive"]
fmt-image = ["viewit-core/fmt-image"]
fmt-ebook = ["viewit-core/fmt-ebook"]
fmt-iwork = ["viewit-core/fmt-iwork"]
fmt-font = ["viewit-core/fmt-font"]
