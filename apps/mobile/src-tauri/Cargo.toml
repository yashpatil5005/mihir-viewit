[package]
name = "viewit-mobile"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt mobile (Android — arm64-v8a only Phase 1)"

[lib]
name = "viewit_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# On Android this binary is not invoked directly; the mobile_entry_point kicks in
# via the lib. Keeping the bin target only because Tauri's setup expects it.
name = "viewit-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
viewit-core = { path = "../../../crates/core", features = ["fmt-text"] }
viewit-core-types = { path = "../../../crates/core-types" }
# custom-protocol: release webview serves embedded frontend, not devUrl (CLI sets this too).
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
zip = "=8.6.0"
tar = "0.4"
flate2 = "1"
base64 = "0.22"
http = "1"
mime_guess = "2"
url = "2"
tiny_http = "0.12"
viewit-fmt-pdf = { path = "../../../crates/fmt-pdf", optional = true }
viewit-fmt-image = { path = "../../../crates/fmt-image" }
heic = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
log = "0.4"

[features]
default = ["fmt-text-only"]
fmt-text-only = ["viewit-core/fmt-text"]
# Minimal native build — only essential formats built-in.
# Office, Archive, Ebook, iWork, Font are delivered via WASM plugins (smaller APK).
fmt-mobile = [
  "fmt-text-only",
  "fmt-image",
]
# Full feature set (for desktop/comparison) - not used on mobile
fmt-everything-lite = [
  "fmt-mobile",
  "fmt-office",
  "fmt-archive",
  "fmt-ebook",
  "fmt-iwork",
  "fmt-font",
]
fmt-everything = [
  "fmt-everything-lite",
  "fmt-pdf",
  "viewit-core/archive-7z",
  "viewit-core/office-encrypted",
]
fmt-office = ["viewit-core/fmt-office"]
fmt-pdf = ["viewit-core/fmt-pdf", "viewit-fmt-pdf"]
fmt-archive = ["viewit-core/fmt-archive"]
fmt-image = ["viewit-core/fmt-image"]
fmt-ebook = ["viewit-core/fmt-ebook"]
fmt-iwork = ["viewit-core/fmt-iwork"]
fmt-font = ["viewit-core/fmt-font"]
