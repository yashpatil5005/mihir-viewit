[package]
name = "viewit-mobile"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt mobile (Android — arm64-v8a only Phase 1)"

[lib]
name = "viewit_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# On Android this binary is not invoked directly; the mobile_entry_point kicks in
# via the lib. Keeping the bin target only because Tauri's setup expects it.
name = "viewit-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
viewit-core = { path = "../../../crates/core", features = ["fmt-text"] }
# custom-protocol: release webview serves embedded frontend, not devUrl (CLI sets this too).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
zip = "=8.6.0"
tar = "0.4"
flate2 = "1"

[features]
default = ["fmt-text-only"]
fmt-text-only = ["viewit-core/fmt-text"]
# Phase 1.4 / 5 — umbrella for full Android build (all fmt-* parsers + iWork).
# fmt-text is always on (text/markdown/json/csv/rtf) since it's tiny and core to the viewer experience.
fmt-everything = [
  "fmt-text-only",
  "fmt-office",
  "fmt-pdf",
  "fmt-archive",
  "fmt-image",
  "fmt-ebook",
  "fmt-iwork",
]
fmt-office = ["viewit-core/fmt-office"]
fmt-pdf = ["viewit-core/fmt-pdf"]
fmt-archive = ["viewit-core/fmt-archive"]
fmt-image = ["viewit-core/fmt-image"]
fmt-ebook = ["viewit-core/fmt-ebook"]
fmt-iwork = ["viewit-core/fmt-iwork"]
