# Canonical Android Rust build settings.
#
# IMPORTANT: these values MUST stay identical to what scripts/android-release.sh
# used to export via CARGO_TARGET_<triple>_* env vars. Cargo fingerprints the
# full rustflags linker/flag string, so any divergence between this file and an
# env override (or between Android Studio / gradle rust builds and our release
# script) forces a full aarch64 rebuild of the dep tree every time you switch
# entry points (~10 min). Keep linker + rustflags the only source of truth here.
#
# minSdk is 24 (see apps/mobile/src-tauri/tauri.conf.json) -> -clang24 drivers.
[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "force-unwind-tables=no"]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "force-unwind-tables=no"]

[target.i686-linux-android]
linker = "i686-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "force-unwind-tables=no"]

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "force-unwind-tables=no"]
