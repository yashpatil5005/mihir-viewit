[package]
name = "viewit-desktop"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ViewIt desktop (Windows/macOS/Linux)"

[lib]
name = "viewit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "viewit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
viewit-core = { path = "../../../crates/core", features = ["fmt-text"] }
viewit-fmt-pdf = { path = "../../../crates/fmt-pdf", optional = true }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
zip = "=8.6.0"
tar = "0.4"
flate2 = "1"
base64 = "0.22"

[features]
default = ["fmt-everything"]
fmt-everything = [
  "fmt-text-only",
  "fmt-office",
  "fmt-pdf",
  "fmt-archive",
  "fmt-image",
  "fmt-ebook",
  "fmt-iwork",
  "fmt-font",
  "archive-7z",
  "office-encrypted",
]
fmt-text-only = ["viewit-core/fmt-text"]
fmt-office = ["viewit-core/fmt-office"]
fmt-pdf = ["viewit-core/fmt-pdf", "dep:viewit-fmt-pdf"]
fmt-archive = ["viewit-core/fmt-archive"]
fmt-image = ["viewit-core/fmt-image"]
fmt-ebook = ["viewit-core/fmt-ebook"]
fmt-iwork = ["viewit-core/fmt-iwork"]
fmt-font = ["viewit-core/fmt-font"]
archive-7z = ["viewit-core/archive-7z"]
office-encrypted = ["viewit-core/office-encrypted"]
