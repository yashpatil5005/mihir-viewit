[package]
name = "viewit-plugin-office-ooxml"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Optional ViewIt enhanced Office OOXML plugin powered by ooxmlsdk"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
jni = "0.21"
ooxmlsdk = { version = "=0.12.0", default-features = false, features = ["parts"] }
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
