# Phase 5 — Android 16 KB release gate. Runs on every PR and push to main/develop.
#
# Why a dedicated job (the existing size-budget.yml covers build size):
#   1. cargo test for the format crates gives regression protection for the
#      structured-ODT / iWork / legacy-PPT / MOBI / AIFF-routing fixes.
#   2. scripts/android-release.sh is the canonical reproducible Android build
#      path — it injects the 16 KB-aligned Rust `.so`, zipaligns `-P 16`,
#      signs, and self-verifies.
#   3. scripts/verify-android-16kb.sh is re-run against the produced APK.
#   4. scripts/android-format-smoke.py is *not* run in CI (it needs a physical
#      device) — a manual prerelease step documents its invocation.
#
# The job fails the build on any regression in: cargo test, frontend build,
# Android release script, or 16 KB ELF/zipalign verification.

name: android-release-gate

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  android-16kb:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # Keep the clean-worktree guard active in CI even if a contributor has
      # VIEWIT_ALLOW_DIRTY set in their fork.
      VIEWIT_ALLOW_DIRTY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.96.0'
          target: 'aarch64-linux-android'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125

      - name: Install npm workspace deps
        run: npm install --workspaces --include-workspace-root

      - name: Cargo format-crate tests (viewit-core, fmt-office, fmt-iwork, fmt-ebook)
        run: cargo test -p viewit-core -p viewit-fmt-office -p viewit-fmt-iwork -p viewit-fmt-ebook --lib

      - name: Frontend build
        run: npm run build --workspace apps/mobile

      - name: Contract schema validation
        run: npm run test:contracts

      - name: Android release + 16 KB verifier
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          VIEWIT_APP_PROFILE=device-test bash scripts/android-release.sh
          ls -la dist/viewit-android-arm64-release.apk
          bash scripts/verify-android-16kb.sh dist/viewit-android-arm64-release.apk

      - name: Upload signed APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewit-android-16kb-apk
          path: dist/viewit-android-arm64-release.apk
          if-no-files-found: error

      - name: Upload 16 KB verifier log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: viewit-16kb-verifier-log
          path: |
            /tmp/viewit-16kb.log
            /tmp/viewit-build.log
