[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/core",
  "crates/fmt-text",
  "crates/fmt-office",
  "crates/fmt-iwork",
  "crates/fmt-pdf",
  "crates/fmt-image",
  "crates/fmt-archive",
  "crates/fmt-ebook",
  "crates/fmt-font",
  "apps/desktop/src-tauri",
  "apps/mobile/src-tauri",
]
# Note: apps/web is NOT a Cargo workspace member because wasm-pack builds it
# standalone with wasm32-unknown-unknown outside the normal cargo pipeline.

[workspace.package]
version = "0.1.0-scaffold"
authors = ["ViewIt Contributors"]
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viewit/viewit"

# Per plan §5 — mobile size-optimization playbook.
# Release profile: max size optimization.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Mobile release inherits release but allows per-target tuning later.
[profile.mobile-release]
inherits = "release"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
zip = { version = "=8.6.0", default-features = false }
# Foundational / widely-used.
chrono = "0.4"
csv = "1"
log = "0.4"
# Office parser stack (fmt-office; native + WASM unified).
calamine = { version = "=0.36.0", default-features = false }
docx-rust = "=0.1.11"
quick-xml = "0.36"
cfb = "=0.7.3"
office-crypto = "=0.2.0"
# Image / PDF / misc.
image = { version = "0.25", default-features = false }
base64 = "0.22"
# Archive stack.
flate2 = { version = "1", default-features = false }
tar = "0.4"
sevenz-rust = "=0.6.1"
# WASM (fmt-office, fmt-archive).
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
console_error_panic_hook = "0.1.7"
console_log = "0.2"
# Desktop / mobile apps.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
