[workspace]
resolver = "2"
members = [
  "crates/core-types",
  "crates/core",
  "crates/fmt-text",
  "crates/fmt-office",
  "crates/fmt-opendoc",
  "crates/fmt-iwork",
  "crates/fmt-pdf",
  "crates/fmt-image",
  "crates/fmt-archive",
  "crates/fmt-ebook",
  "apps/desktop/src-tauri",
  "apps/mobile/src-tauri",
]
# Note: apps/web is NOT a Cargo workspace member because wasm-pack builds it
# standalone with wasm32-unknown-unknown outside the normal cargo pipeline.

[workspace.package]
version = "0.1.0-scaffold"
authors = ["ViewIt Contributors"]
edition = "2021"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/viewit/viewit"

# Per plan §5 — mobile size-optimization playbook.
# Release profile: max size optimization.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Mobile release inherits release but allows per-target tuning later.
[profile.mobile-release]
inherits = "release"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
zip = "=8.6.0"
