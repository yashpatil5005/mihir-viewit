# cargo-deny configuration (run via `cargo deny` / `make deny`; enforced in CI).
#
# Policy intent:
#   * Dual MIT/Apache-2.0 project → allow OSI-common permissive licenses and
#     reject copyleft/*GPL as non-goals for this codebase.
#   * safety/vulnerability check always on (advisories).
#   * Homegrown crypto is intentionally avoided — signing relies on the
#     audited `pynacl`/Ed25519 path in scripts/sign-catalog.py.

[graph]
# Skip the tooling userspace crate (no runtime code).
exclude = [".cargo"]

[output]
feature-depth = 1

# --- Licenses ---
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
]
# A handful of crates (e.g. some font/pdf helpers) are MIT/Apache licensed but
# miss SPDX metadata; list them here *with a maintainer note* after review.
# confidence = 0.8
deny = ["GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "AGPL-3.0", "AGPL-3.0-only",
        "GPL-2.0", "GPL-2.0-only", "LGPL-2.1", "LGPL-2.1-only", "LGPL-3.0",
        "LGPL-3.0-only", "MPL-2.0"]
copyleft = "deny"
allow-osi-fsf-free = "neither"
allow-dfsg-free = "unclear"
default = "deny"

[licenses.private]
# Private crates (no published license declaration needed):
ignore = ["viewit-core-types", "viewit-core", "viewit-fmt-text",
          "viewit-fmt-office", "viewit-fmt-office-universal", "viewit-fmt-iwork",
          "viewit-fmt-pdf", "viewit-fmt-image", "viewit-fmt-archive",
          "viewit-fmt-archive-universal", "viewit-fmt-opendoc", "viewit-fmt-ebook",
          "viewit-fmt-font", "viewit-mobile", "viewit-desktop",
          "viewit-plugin-office-ooxml", "viewit-compression-universal-plugin",
          "viewit-plugin-office-universal", "viewit-plugin-font-universal"]

# --- Dependencies: bans & advisories ---
[bans]
multiple-versions = "warn"
wildcards = "deny"
skip-tree = []

[advisories]
version = 2
yanked = "deny"

# --- Sources ---
[sources]
allow-git = []
