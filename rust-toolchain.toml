[toolchain]
channel = "1.96.0"
components = ["rust-src", "rustfmt", "clippy"]
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "i686-linux-android",
  "x86_64-linux-android",
  "x86_64-unknown-linux-gnu",
]
# wasm32-unknown-unknown is intentionally NOT pinned here:
# only apps/web needs it and on-demand `rustup target add` from Phase 1.6
# keeps the host toolchain lean for everyone else.
profile = "minimal"
